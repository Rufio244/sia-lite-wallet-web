<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>เข้าสู่ระบบ</title></head>
<body style="max-width:400px;margin:50px auto;font-family:sans-serif">
  <h2>🔐 เข้าสู่ระบบ</h2>
  <input id="user" placeholder="ชื่อผู้ใช้" style="width:100%;padding:8px;margin:8px 0">
  <input id="pass" type="password" placeholder="รหัสผ่าน" style="width:100%;padding:8px;margin:8px 0">
  <button onclick="login()" style="padding:10px 20px">เข้าสู่ระบบ</button>
  <p id="msg"></p>
  <script>
    async function login() {
      const r = await fetch("/api/auth/login", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          user:document.getElementById("user").value,
          pass:document.getElementById("pass").value
        })
      });
      const d = await r.json();
      if(d.ok) {
        localStorage.token = d.token;
        localStorage.isOwner = d.isOwner;
        window.location.href = d.isOwner ? "admin.html" : "dashboard.html";
      } else {
        document.getElementById("msg").textContent = d.e;
      }
    }
  </script>
</body>
</html>
